[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specer"
version = "0.1.0b5"
readme = "README.md"
authors = [{name = "Kevin Lee"}]
license = {text = "MIT"}
description = "从需求描述结合现有文档和代码资料自动生成开发文档和代码规格说明"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
specer = "specgen.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["specgen*"]
exclude = ["specgen.tests*"]
