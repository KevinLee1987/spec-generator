[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specgen"
version = "0.1.0"
description = "从需求描述结合现有文档和代码资料自动生成开发文档和代码规格说明"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
specgen = "specgen.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["specgen*"]
